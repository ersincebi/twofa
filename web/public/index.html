<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="referrer" content="no-referrer">
  <title>TwoFA</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <section id="lock" hidden>
    <img src="/icon-192.png" alt="" class="logo">
    <h1>TwoFA</h1>
    <p id="lock-hint" class="hint"></p>
    <form id="lock-form">
      <input id="password" type="password" placeholder="Master password" required>
      <input id="password2" type="password" autocomplete="new-password" placeholder="Repeat password" hidden>
      <label class="check"><input id="remember" type="checkbox"> Remember on this device</label>
      <button id="unlock" type="submit" class="primary">Unlock</button>
      <p id="lock-error" class="error"></p>
    </form>
  </section>

  <section id="main" hidden>
    <header>
      <input id="search" type="search" placeholder="Search" autocomplete="off">
      <span id="status"></span>
      <button id="edit-toggle" class="icon" title="Edit">✎</button>
      <button id="add-open" class="icon" title="Add">＋</button>
    </header>
    <ul id="list"></ul>
    <p id="empty" class="hint" hidden>No accounts yet. Tap ＋ to add one.</p>
    <footer>
      <button id="export">Export</button>
      <button id="lock-now">Lock</button>
    </footer>
  </section>

  <dialog id="add">
    <form id="add-form">
      <h2>Add account</h2>
      <div class="row">
        <button type="button" id="scan">Scan QR</button>
        <button type="button" id="pick-file">Image / file</button>
        <input id="file" type="file" accept="image/*,.txt,.json" hidden>
      </div>
      <video id="camera" playsinline muted hidden></video>
      <textarea id="secret" rows="3" placeholder="Secret key, or otpauth:// links (one per line)" autocomplete="off" spellcheck="false"></textarea>
      <input id="issuer" placeholder="Issuer (e.g. GitHub)" autocomplete="off">
      <input id="name" placeholder="Account (e.g. me@example.com)" autocomplete="off">
      <p id="add-error" class="error"></p>
      <div class="row end">
        <button type="button" id="add-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" hidden></div>
</body>
</html>
